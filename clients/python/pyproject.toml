[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-toolkit"
version = "2.0.0"
description = "Python client and agent-framework tool wrappers for the LinkedIn Toolkit local HTTP API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["linkedin", "agents", "tools", "langchain", "crewai", "llamaindex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.27", "pydantic>=2"]

[project.urls]
Homepage = "https://github.com/FormatixAI/linkedin-toolkit"
Documentation = "https://github.com/FormatixAI/linkedin-toolkit/tree/main/docs/agents"
Source = "https://github.com/FormatixAI/linkedin-toolkit"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.11"]
crewai = ["crewai>=0.70"]
autogen = ["autogen-agentchat>=0.4"]
google-adk = ["google-adk>=0.1"]
pydantic-ai = ["pydantic-ai-slim>=0.0.20"]
smolagents = ["smolagents>=1.0"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["linkedin_toolkit"]

[tool.hatch.build.targets.wheel.force-include]
"linkedin_toolkit/tools.json" = "linkedin_toolkit/tools.json"

[tool.hatch.build.targets.sdist]
include = ["linkedin_toolkit", "tests", "scripts", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
